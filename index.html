<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Baccha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffdce6,#fff5f8);
overflow:hidden;
}

.container{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
max-width:350px;
animation:fade 1.2s ease;
}

h1{
font-size:34px;
color:#ff3b6f;
margin-bottom:10px;
}

h3{
font-weight:500;
color:#555;
margin-bottom:25px;
}

p{
color:#666;
line-height:1.7;
margin-bottom:30px;
}

button{
background:#ff4f81;
color:#fff;
border:none;
padding:15px 30px;
border-radius:50px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#ff2d68;
}

#message{
display:none;
margin-top:25px;
font-size:18px;
color:#444;
animation:fade 1s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
font-size:20px;
animation:float 8s linear infinite;
opacity:.3;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-120vh);
}
}
</style>

</head>
<body>

<div class="container">

<h1>❤️</h1>

<h2>For My Baccha</h2>

<h3>Happy National Girlfriend Day</h3>

<p>
Every moment with you has become
my favourite memory.
</p>

<button onclick="showMessage()">
Open My Message
</button>

<div id="message">

<p>

Dear My Baccha ❤️

<br><br>

Thank you for making my life happier,
brighter and more beautiful.

<br><br>

Happy National Girlfriend Day.

<br><br>

Forever Yours,

<b>Betu ❤️</b>

</p>

</div>

</div>

<script>

function showMessage(){

document.getElementById("message").style.display="block";

}

for(let i=0;i<25;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(5+Math.random()*5)+"s";

heart.style.fontSize=(15+Math.random()*20)+"px";

document.body.appendChild(heart);

}

</script>

</body>
</html>
